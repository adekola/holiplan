name: publish

# Run it by hand for a dry run: build, upload to TestPyPI and check the package
# installs and starts. Push a tag like v0.1.0 to do the same and then publish
# to PyPI. Uploads use trusted publishing (OIDC), so there are no tokens.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read the version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${{ steps.version.outputs.version }}"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A dry run and the tagged release upload the same version.
          skip-existing: true

  check-testpypi:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install from TestPyPI and start the server
        run: |
          # Dependencies come from PyPI; only holiplan comes from TestPyPI.
          for attempt in 1 2 3 4 5 6; do
            pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ \
              "holiplan==${{ needs.build.outputs.version }}" && break
            echo "Not on the index yet; retrying"; sleep 20
          done
          python - <<'EOF'
          import asyncio
          from holiplan import server
          tools = asyncio.run(server.mcp.list_tools())
          schema = server.profile_schema()
          assert len(tools) == 9, [t.name for t in tools]
          print(f"Installed holiplan serves {len(tools)} tools; profile schema {len(schema)} chars")
          EOF

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
